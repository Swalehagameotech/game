# Test Profile Configuration
spring.application.name=platform-test
server.port=0

# MongoDB URI for tests without replicaSet requirement
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/teenpatti_test_db}
spring.data.mongodb.auto-index-creation=true

# Security & JWT Configuration
jwt.secret=test_secret_key_change_in_production_environment_with_at_least_256_bits_length
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Logging
logging.level.com.teenpatti.platform=INFO
