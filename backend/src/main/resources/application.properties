# Application Configuration
spring.application.name=platform
server.port=${PORT:8080}

# MongoDB Configuration (Connects to live Atlas cluster0.smr2srl.mongodb.net)
spring.data.mongodb.uri=${DBURL:${MONGODB_URI:mongodb+srv://zarekariswaleha_db_user:WT8OeOHbzv2R2oIG@cluster0.smr2srl.mongodb.net/teenpatti_db?appName=Cluster0}}
spring.data.mongodb.auto-index-creation=true

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:dev_secret_key_change_in_production_environment_with_at_least_256_bits_length}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:604800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:2592000000}

# CORS Configuration
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173,http://localhost:3000,http://localhost:3001}

# Jackson Configuration - Fail on unexpected payload properties
spring.jackson.deserialization.fail-on-unknown-properties=true

# Logging - Sensitive data protection (Security Debug Logging explicitly OFF)
logging.level.com.teenpatti.platform=INFO
logging.level.org.springframework.security=INFO

# Payment Gateway (Razorpay) Configuration
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_dummyKeyId}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:dummySecret}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:dummyWebhookSecret}

# Transaction Deposit Limits (in Paise: Min ₹100 = 10,000 paise, Max ₹50,000 = 5,000,000 paise)
app.deposit.min-amount-paise=${MIN_DEPOSIT_PAISE:10000}
app.deposit.max-amount-paise=${MAX_DEPOSIT_PAISE:5000000}

# Transaction Withdrawal Limits (in Paise: Min ₹500 = 50,000 paise, Max ₹100,000 = 10,000,000 paise)
app.withdrawal.min-amount-paise=${MIN_WITHDRAWAL_PAISE:50000}
app.withdrawal.max-amount-paise=${MAX_WITHDRAWAL_PAISE:10000000}
app.withdrawal.require-kyc=${WITHDRAWAL_REQUIRE_KYC:false}

# Wallet demo deposit (set false to keep admin-only wallet funding)
app.wallet.demo-deposit-enabled=${WALLET_DEMO_DEPOSIT:false}
app.auth.initial-wallet-paise=${INITIAL_WALLET_PAISE:0}

# Table Stake Tier Minimum Buy-In Limits (in Paise: LOW ₹10 = 1000, MEDIUM ₹50 = 5000, HIGH ₹250 = 25000)
app.stake.low.min-buy-in-paise=${STAKE_LOW_MIN_BUY_IN:1000}
app.stake.medium.min-buy-in-paise=${STAKE_MEDIUM_MIN_BUY_IN:5000}
app.stake.high.min-buy-in-paise=${STAKE_HIGH_MIN_BUY_IN:25000}

# Table Lifecycle & Cleanup Configuration
app.table.waiting-timeout-minutes=${TABLE_WAITING_TIMEOUT_MINUTES:10}
app.table.cleanup-interval-ms=${TABLE_CLEANUP_INTERVAL_MS:60000}

# WebSocket Real-Time Game Engine Configuration
app.game.disconnect-grace-period-seconds=${DISCONNECT_GRACE_PERIOD_SECONDS:30}
app.game.turn-timeout-seconds=${TURN_TIMEOUT_SECONDS:20}
app.game.house-account-id=${HOUSE_ACCOUNT_ID:house_platform_admin}
app.game.next-round-delay-seconds=${NEXT_ROUND_DELAY_SECONDS:60}
# Pause after winner banner before next-round countdown begins
app.game.winner-display-seconds=${WINNER_DISPLAY_SECONDS:5}

# Default betting configuration bootstrap (used only if collection has no active config yet)
app.betting.default.boot-amount-paise=${BETTING_BOOT_AMOUNT_PAISE:1000}
app.betting.default.minimum-players=${BETTING_MIN_PLAYERS:3}
app.betting.default.maximum-players=${BETTING_MAX_PLAYERS:6}
app.betting.default.turn-timer-seconds=${BETTING_TURN_TIMER_SECONDS:20}
app.betting.default.blind-bet-paise=${BETTING_BLIND_BET_PAISE:1000}
app.betting.default.seen-chaal-paise=${BETTING_SEEN_CHAAL_PAISE:2000}
app.betting.default.show-cost-paise=${BETTING_SHOW_COST_PAISE:2000}
app.betting.default.side-show-cost-paise=${BETTING_SIDE_SHOW_COST_PAISE:2000}

# Smart matchmaking + AI bots
teenpatti.matchmaking.wait-for-humans-ms=${MATCHMAKING_WAIT_MS:7000}
teenpatti.matchmaking.min-players=${MATCHMAKING_MIN_PLAYERS:3}
teenpatti.matchmaking.fill-to-max=${MATCHMAKING_FILL_TO_MAX:false}




