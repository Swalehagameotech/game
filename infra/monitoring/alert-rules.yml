groups:
  - name: platform-alerts
    rules:
      - alert: MongoPrimaryLost
        expr: mongodb_replica_set_member_health{role="primary"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "MongoDB Replica Set Primary Lost"
          description: "No primary instance available in MongoDB replica set rs0."

      - alert: KafkaConsumerLagHigh
        expr: kafka_consumergroup_lag > 500
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Kafka Consumer Lag"
          description: "Consumer lag on topic {{ $labels.topic }} exceeds 500 messages."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) > 5
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API High 5xx Error Rate"
          description: "Backend HTTP 5xx error rate exceeds threshold."
