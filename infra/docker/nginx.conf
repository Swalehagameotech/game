events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Upstream backend cluster for REST API (Round-Robin)
    upstream api_backend_cluster {
        server backend-1:8080;
        server backend-2:8080;
    }

    # Upstream backend cluster for WebSocket (Sticky IP Hash)
    upstream ws_backend_cluster {
        ip_hash;
        server backend-1:8080;
        server backend-2:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend Static Server Proxy
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # REST API Load Balancing (Round-Robin)
        location /api/ {
            proxy_pass http://api_backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Load Balancing (Sticky Sessions via IP Hash)
        location /ws/ {
            proxy_pass http://ws_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Actuator / Prometheus Metrics
        location /actuator/ {
            proxy_pass http://api_backend_cluster;
            proxy_set_header Host $host;
        }
    }
}
